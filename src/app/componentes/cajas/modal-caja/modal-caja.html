@if (visible) {
<div class="modal-overlay d-flex justify-content-center align-items-center" [style.--color-sistema]="colorSistema">
    <div class="modal-caja-card shadow">
        <h4 class="fw-bold mb-3">{{ modoEdicion() ? 'Editar caja' : 'Nueva caja' }}</h4>

        <!-- Nombre -->
        <label class="form-label fw-semibold mb-1">Nombre de la caja</label>
        <input type="text" class="form-control mb-3" placeholder="Ingrese el nombre de la caja"
            [ngModel]="nombre()" (ngModelChange)="nombre.set($event)">

        <!-- Buscar usuario -->
        <label class="form-label fw-semibold mb-1">Buscar usuario</label>
        <div class="search-box mb-2">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Buscar usuario..."
                [ngModel]="busqueda()" (ngModelChange)="busqueda.set($event)">
        </div>

        <!-- Lista de usuarios (checkboxes) -->
        <label class="form-label small text-muted mb-1">Seleccione los usuarios que usarán esta caja</label>
        <div class="usuarios-lista">
            @for (u of usuariosFiltrados(); track u.CodigoUsuario) {
            <label class="usuario-item">
                <input type="checkbox" [checked]="estaSeleccionado(u.CodigoUsuario)"
                    (change)="alternarUsuario(u.CodigoUsuario)">
                <span>{{ u.Nombre }}</span>
            </label>
            } @empty {
            <div class="text-muted small py-2 text-center">No hay usuarios</div>
            }
        </div>

        <!-- Acciones -->
        <div class="d-flex justify-content-end gap-2 mt-3">
            <button class="btn btn-cancelar" (click)="cerrar()">Cancelar</button>
            <button class="btn btn-guardar text-white" [style.background-color]="colorSistema"
                (click)="guardar()">Guardar</button>
        </div>
    </div>
</div>
}
